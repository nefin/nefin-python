[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nefin"
dynamic = ["version"]
description = "Pythonic loaders for NEFIN (Núcleo de Estudos em Economia e Finanças) public datasets"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaue Moraes", email = "kauelopesmoraes22@gmail.com" }]
keywords = [
    "finance",
    "asset-pricing",
    "risk-factors",
    "brazil",
    "nefin",
    "pandas",
    "quantitative-finance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.5",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/nefin/nefin-python"
Repository = "https://github.com/nefin/nefin-python"
Issues = "https://github.com/nefin/nefin-python/issues"
"Data source" = "https://nefin.com.br/nefindata/README.md"

[project.optional-dependencies]
excel = ["xlrd>=2.0", "openpyxl>=3.1"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
lint = ["ruff>=0.8"]
dev = ["nefin[excel,test,lint]", "pre-commit>=3.5"]

[tool.hatch.version]
path = "src/nefin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nefin"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 96
target-version = "py39"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is handled by the formatter, not worth failing CI over
]

[tool.ruff.lint.per-file-ignores]
# Parenthesized multi-context `with` (the usual SIM117 fix) needs Python 3.10+;
# this project supports 3.9, so nested `with` blocks in tests are intentional.
"tests/*" = ["E501", "SIM117"]

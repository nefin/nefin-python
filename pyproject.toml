[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nefin"
dynamic = ["version"]
description = "Pythonic loaders for NEFIN (Núcleo de Estudos em Economia e Finanças) public datasets"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kaue Moraes", email = "kauelopesmoraes22@gmail.com" }]
keywords = [
    "finance",
    "asset-pricing",
    "risk-factors",
    "brazil",
    "nefin",
    "pandas",
    "quantitative-finance",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "pandas>=1.5",
    "requests>=2.28",
]

[project.urls]
Homepage = "https://github.com/nefin/nefin-python"
Repository = "https://github.com/nefin/nefin-python"
Issues = "https://github.com/nefin/nefin-python/issues"
"Data source" = "https://nefin.com.br/nefindata/README.md"

[project.optional-dependencies]
excel = ["xlrd>=2.0", "openpyxl>=3.1"]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
dev = ["nefin[excel,test]"]

[tool.hatch.version]
path = "src/nefin/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nefin"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
